# abyss-security: baseline sshd hardening

# Never allow direct root login over SSH
PermitRootLogin no

# Reduce brute-force window a bit
MaxAuthTries 3
LoginGraceTime 30

PermitEmptyPasswords no

# Avoid leaking too much info
PrintMotd no
PrintLastLog yes

X11Forwarding no
AllowTcpForwarding yes
PermitTunnel no
