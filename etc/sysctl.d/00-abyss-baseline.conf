# abyss-security: baseline sysctl hardening

# Restrict kernel pointer exposure
kernel.kptr_restrict = 2

# Restrict dmesg access to privileged users
kernel.dmesg_restrict = 1

# Restrict ptrace to same-uid by default (debuggers still work for same user)
kernel.yama.ptrace_scope = 1

# Symlink/hardlink protections
fs.protected_symlinks = 1
fs.protected_hardlinks = 1

# Protect against some FIFO/regular-file attacks in world-writable dirs
fs.protected_fifos = 2
fs.protected_regular = 2
